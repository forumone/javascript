name: CI

# No `paths:` filter: required checks must always report a status, or PRs
# that don't touch matching paths would wait forever on a skipped check.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # tiny-mustache has no tests yet; add it here once it does.
        package:
          - eslint-config-forumone-es5
          - eslint-config-forumone-react
    defaults:
      run:
        working-directory: ./packages/${{ matrix.package }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # The react package depends on the es5 package via a `file:` link, so
      # es5's own dependencies (e.g. @eslint/js) must be installed too.
      - name: Install es5 Dependencies (linked by react)
        if: matrix.package == 'eslint-config-forumone-react'
        working-directory: ./packages/eslint-config-forumone-es5
        run: npm ci

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

  # Single stable check name to require in the ruleset, regardless of how
  # the matrix above changes.
  tests-pass:
    name: tests-pass
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Verify all test jobs succeeded
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          if [[ "$RESULT" != "success" ]]; then
            echo "Test jobs finished with result: $RESULT" >&2
            exit 1
          fi

  version-bumped:
    name: version-bumped
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require at least one package version change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=0
          for pkg in packages/*/package.json; do
            head_version=$(node -p "require('./$pkg').version")
            if base_json=$(git show "$BASE_SHA:$pkg" 2>/dev/null); then
              base_version=$(node -p "JSON.parse(process.argv[1]).version" "$base_json")
            else
              base_version="(new package)"
            fi
            if [[ "$head_version" != "$base_version" ]]; then
              echo "✔ $pkg: $base_version -> $head_version"
              changed=1
            else
              echo "  $pkg: unchanged ($head_version)"
            fi
          done
          if [[ "$changed" -eq 0 ]]; then
            echo "No package version changed. Bump the version of at least one package." >&2
            exit 1
          fi
